<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen | Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="/assets/WHITE_LOGO_1.avif">
    <!--------- Boostrap Linking ------------>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!--------- Font Awesome Linking -------->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!---------- Fonts style Liniking --------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
                <h1 class="text-primary display-3 fw-bold">Login Here<i class="fa-solid fa-down-long"></i></h1>
                <label class="" for="text">User</label>
                <input class="border-none rounded-5 ps-2" type="text" placeholder="Enter Name" id="name">
                <p id="us">&nbsp;</p>
                <label class="" for="text">Password</label>
                <input class="border-none rounded-5 ps-2" type="password" placeholder="Enter Password" id="pwd">
                <p id="ps">&nbsp;</p>
                <button onclick="login()" class="btn border-none bg-warning rounded-5 fs-4 fw-semibold">Login<i class="fa-solid fa-right-to-bracket ps-1 fs-5"></i></button>
    </div>

    <!------------ Script Linking ------------->
    <script src="login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
